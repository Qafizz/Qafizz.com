<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bot Control</title>
<style>
  :root { --bg:#0e0f12; --card:#181a20; --line:#2a2d35; --text:#eceef2; --muted:#9097a3; --green:#2fbf71; --red:#e5484d; --amber:#f0b429; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:22px; margin:4px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .muted { color:var(--muted); font-size:14px; }
  .big { font-size:30px; font-weight:700; margin:2px 0 8px; }
  .on { color:var(--green); } .off { color:var(--red); } .warn { color:var(--amber); }
  button { width:100%; border:0; border-radius:12px; padding:16px; font-size:18px; font-weight:700; color:#fff; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  .start { background:var(--green); } .pause { background:var(--red); margin-top:10px; }
  .ghost { background:transparent; border:1px solid var(--line); color:var(--muted); font-size:14px; padding:10px; margin-top:12px; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0b0c0f; color:var(--text); font-size:16px; margin:6px 0 10px; }
  #msg { min-height:20px; }
  ul { margin:6px 0 0; padding-left:18px; }
</style>
</head>
<body>
<main>
  <h1>Copy bot</h1>

  <section id="login" class="card" hidden>
    <div class="muted">Admin sign-in</div>
    <input id="email" type="email" autocomplete="username" placeholder="Email">
    <input id="pass" type="password" autocomplete="current-password" placeholder="Password">
    <button id="signin" class="start">Sign in</button>
    <p id="loginMsg" class="muted"></p>
  </section>

  <section id="panel" hidden>
    <div class="card">
      <div class="muted">Buying</div>
      <div id="state" class="big">…</div>
      <div id="seen" class="muted">waiting for the PC…</div>
      <div style="margin-top:14px">
        <button id="startBtn" class="start">Start buying</button>
        <button id="pauseBtn" class="pause">Pause buying</button>
      </div>
      <p id="msg" class="muted"></p>
      <p class="muted">Pause stops new buys. Coins the bot already holds are still sold when the copied wallet sells.</p>
    </div>

    <div class="card">
      <div class="row"><span class="muted">Profit (this run)</span><span id="pnl">–</span></div>
      <div class="row"><span class="muted">Trades / wins</span><span id="trades">–</span></div>
      <div class="row"><span class="muted">Wallet</span><span id="wallet">–</span></div>
      <div class="row"><span class="muted">Loss cap</span><span id="cap">–</span></div>
      <div class="row"><span class="muted">Wallets copied</span><span id="nwallets">–</span></div>
      <div class="row"><span class="muted">Live feed</span><span id="feed">–</span></div>
    </div>

    <div class="card">
      <div class="muted">Open coins</div>
      <ul id="open"><li class="muted">none</li></ul>
    </div>

    <button id="signout" class="ghost">Sign out</button>
  </section>
</main>

<script type="module">
const SDK = "https://www.gstatic.com/firebasejs/10.12.2";
const { initializeApp } = await import(`${SDK}/firebase-app.js`);
const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } = await import(`${SDK}/firebase-auth.js`);
const { getFirestore, doc, onSnapshot, setDoc, serverTimestamp } = await import(`${SDK}/firebase-firestore.js`);

// Public web config (same Firebase project as the card site). Firestore rules allow only the verified admin here.
const app = initializeApp({
  apiKey: "AIzaSyDAmrKQj8EogmvcBOFC2Z7VcD40GKX9hq0",
  authDomain: "ucg-card.firebaseapp.com",
  projectId: "ucg-card",
  appId: "1:31449082114:web:f4a6a73d1b3d78f4aa3a1b"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = (id) => document.getElementById(id);
let unsub = [];

$("signin").onclick = async () => {
  $("loginMsg").textContent = "Signing in…";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); $("pass").value = ""; }
  catch (e) { $("loginMsg").textContent = "Sign-in failed: " + (e.code || e.message); }
};
$("signout").onclick = () => signOut(auth);

async function setBuying(on) {
  $("msg").textContent = on ? "Sending start…" : "Sending pause…";
  try {
    await setDoc(doc(db, "bot", "control"), { trading_on: on, at: serverTimestamp(), by: auth.currentUser.email });
    $("msg").textContent = (on ? "Start" : "Pause") + " sent — the PC applies it within ~10 s.";
  } catch (e) { $("msg").textContent = "Not allowed: " + (e.code || e.message); }
}
$("startBtn").onclick = () => setBuying(true);
$("pauseBtn").onclick = () => setBuying(false);

const cad = (v) => (v >= 0 ? "+" : "−") + "$" + Math.abs(v).toFixed(2);

function render(s) {
  const age = s.at ? Math.round((Date.now() - s.at.toMillis()) / 1000) : null;
  const fresh = age !== null && age < 90;
  $("state").textContent = s.trading_on ? "ON" : "PAUSED";
  $("state").className = "big " + (s.trading_on ? "on" : "off");
  $("seen").textContent = age === null ? "PC hasn't reported yet"
    : fresh ? `PC updated ${age}s ago` : `PC last seen ${Math.round(age / 60)} min ago — it may be off`;
  $("seen").className = fresh ? "muted" : "warn";
  $("pnl").textContent = cad(s.pnl_cad ?? 0); $("pnl").className = (s.pnl_cad ?? 0) >= 0 ? "on" : "off";
  $("trades").textContent = `${s.trades ?? 0} / ${s.wins ?? 0}`;
  $("wallet").textContent = `${(s.wallet_sol ?? 0).toFixed(4)} SOL`;
  $("cap").textContent = `$${(s.stop_cad ?? 0).toFixed(2)}`;
  $("nwallets").textContent = s.wallets ?? "–";
  $("feed").textContent = s.feed ?? "–";
  const open = s.open || [];
  $("open").innerHTML = open.length
    ? open.map(o => `<li>${o.sym} <span class="${o.pct >= 0 ? "on" : "off"}">${o.pct >= 0 ? "+" : ""}${Math.round(o.pct)}%</span></li>`).join("")
    : '<li class="muted">none</li>';
}

onAuthStateChanged(auth, (user) => {
  unsub.forEach((u) => u()); unsub = [];
  $("login").hidden = !!user; $("panel").hidden = !user;
  if (!user) return;
  unsub.push(onSnapshot(doc(db, "bot", "status"), (snap) => snap.exists() && render(snap.data()),
    (e) => { $("seen").textContent = "No access: " + e.code; $("seen").className = "warn"; }));
});
</script>
</body>
</html>
